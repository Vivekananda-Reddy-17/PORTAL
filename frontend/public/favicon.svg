<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     fill="none">

    <defs>

        <radialGradient id="core"
            cx="50%" cy="50%" r="60%">
            <stop offset="0%" stop-color="#FFE7A8"/>
            <stop offset="55%" stop-color="#FDBA74"/>
            <stop offset="100%" stop-color="#F97316"/>
        </radialGradient>

        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>

    <!-- Outer glow ring -->

    <g
        stroke="#F97316"
        stroke-width="18"
        stroke-linecap="round"
        filter="url(#glow)"
        opacity=".95">

        <path d="M128 36
                 A92 92 0 0 1 202 74"/>

        <path d="M220 128
                 A92 92 0 0 1 182 202"/>

        <path d="M128 220
                 A92 92 0 0 1 54 182"/>

        <path d="M36 128
                 A92 92 0 0 1 74 54"/>

    </g>

    <!-- Inner ring -->

    <g
        stroke="#FDBA74"
        stroke-width="8"
        stroke-linecap="round"
        opacity=".9">

        <path d="M128 58
                 A70 70 0 0 1 184 82"/>

        <path d="M198 128
                 A70 70 0 0 1 174 184"/>

        <path d="M128 198
                 A70 70 0 0 1 72 174"/>

        <path d="M58 128
                 A70 70 0 0 1 82 72"/>

    </g>

    <!-- Energy particles -->

    <circle cx="206" cy="62" r="5" fill="#FDBA74"/>
    <circle cx="50" cy="192" r="4" fill="#F97316"/>
    <circle cx="62" cy="58" r="3" fill="#FDBA74"/>
    <circle cx="194" cy="198" r="3" fill="#FDBA74"/>

    <!-- Portal core -->

    <circle
        cx="128"
        cy="128"
        r="24"
        fill="url(#core)"
        opacity=".12"/>

</svg>